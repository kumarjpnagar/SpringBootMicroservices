<source>
  @type forward
  port 24224
</source>

<filter docker>
  @type concat
  key log
  stream_identity_key container_id
  multiline_start_regexp /^[0-9]{4}-[0-9]{2}-[0-9]{2}\s[0-9].?[:][0-9]{2}:[0-9]{2}[.][0-9]{3}/
  multiline_end_regexp /^\s+\.\.\.$/
  flush_interval 5
</filter>

<filter docker>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type multiline_grok
    grok_pattern %{DATA:timestamp}\s+%{LOGLEVEL:log_level}\s+\[%{DATA:component_name},%{DATA:trace_id},%{DATA:span_id},%{DATA:exported_to_zipkins}\]\s+%{DATA:pid}\s+---\s+\[\s*%{DATA:thread}\]\s+%{DATA:class}\s+:\s+%{GREEDYDATA:message}
  </parse>
</filter>

<filter docker>
  @type elasticsearch_timestamp_check
</filter>

<match docker>
  @type elasticsearch
  host $EFK_HOST
  port 9200
  logstash_format true
  logstash_prefix fluentd
  logstash_dateformat %Y%m%d
  include_tag_key true
  type_name container
  tag_key @log_name
  flush_interval 10s
</match>
