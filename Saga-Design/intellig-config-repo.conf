<IfModule !mpm_prefork_module>
    LoadModule cgid_module modules/mod_cgid.so
</IfModule>
<IfModule mpm_prefork_module>
    LoadModule cgi_module modules/mod_cgi.so
</IfModule>

# GIT changes starts here #

DocumentRoot  /opt/config-repos
DirectoryIndex config.file
  
SetEnv GIT_PROJECT_ROOT /opt/config-repos
SetEnv GIT_HTTP_EXPORT_ALL
SetEnv REMOTE_USER $REDIRECT_REMOTE_USER

Alias /gitRepositories /opt/config-repos
<Directory /opt/config-repos>
    Options Indexes ExecCGI
    IndexOptions FancyIndexing FoldersFirst NameWidth=* DescriptionWidth=*
    AddHandler cgi-script .exe .file
    AllowOverride None
    Require all granted
</Directory>

ScriptAlias /git/ /usr/libexec/git-core/git-http-backend/

# Note: Serve repository objects with Git HTTP backend 
ScriptAliasMatch \
        "(?x)^/(.*/(HEAD | \
                    info/refs | \
                    objects/info/[^/]+ | \
                    git-(upload|receive)-pack))$" \
		/usr/libexec/git-core/git-http-backend/$1
 
<Directory /usr/libexec/git-core/>
    Options +ExecCGI
    # AddHandler cgi-script .exe .file
    Require all granted
</Directory>
  
<Directory />
    Options +ExecCGI
    # AddHandler cgi-script .exe .file
    Require all granted
</Directory>
 
<LocationMatch "^/git/.*/git-receive-pack$">
    Options +ExecCGI
    Require all granted
    #AuthType Basic
    #AuthName intranet
    #AuthUserFile "C:/git-server/config/users"
    #Require valid-user
</LocationMatch>

<LocationMatch "^/git/.*/git-upload-pack$">
    Options +ExecCGI
    Require all granted
    #AuthType Basic
    #AuthName intranet
    #AuthUserFile "C:/git-server/config/users"
    #Require valid-user
</LocationMatch>

<LocationMatch "^/git/.*/sh">
    Options +ExecCGI
    Require all granted
    #AuthType Basic
    #AuthName intranet
    #AuthUserFile "C:/git-server/config/users"
    #Require valid-user
</LocationMatch>

<LocationMatch "^/git/.*/bash">
    Options +ExecCGI
    Require all granted
    #AuthType Basic
    #AuthName intranet
    #AuthUserFile "C:/git-server/config/users"
    #Require valid-user
</LocationMatch>

<LocationMatch "^/config.git/*">
    Options +ExecCGI
    Require all granted
    #AuthType Basic
    #AuthName intranet
    #AuthUserFile "C:/git-server/config/users"
    #Require valid-user
</LocationMatch>

<LocationMatch "^/git/.*/hooks/*">
    Options +ExecCGI
    AddHandler cgi-script .exe .file
    #Require all granted
    #AuthType Basic
    #AuthName intranet
    #AuthUserFile "C:/git-server/config/users"
    #Require valid-user
</LocationMatch>

# GIT changes ends here #

