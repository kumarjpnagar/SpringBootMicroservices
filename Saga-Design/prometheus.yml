# my global config
global:
  scrape_interval:     65s
  evaluation_interval: 65s


rule_files:
  # - "first.rules"
  # - "second.rules"

# A scrape configuration containing exactly one endpoint to scrape:

scrape_configs:
  - job_name: 'func-monitor'
    metrics_path: /funcmetrics
    scrape_interval: 35s
    scrape_timeout: 30s
    honor_labels: true
    file_sd_configs:
    - files:
      - /etc/prometheus/targets/target.yml
      refresh_interval: 2m

  - job_name: 'tech-monitor'
    metrics_path: /techmetrics
    scrape_interval: 35s
    scrape_timeout: 30s
    honor_labels: true
    file_sd_configs:
    - files:
      - /etc/prometheus/targets/tech-target.yml
      refresh_interval: 2m

